<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Favicon: EUI logo -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/New_Logo_EUI_2021_cropped.svg.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/New_Logo_EUI_2021_cropped.svg.png">
  <link rel="apple-touch-icon" href="/assets/images/New_Logo_EUI_2021_cropped.svg.png">

  <!-- Google Fonts: Lora (serif headings) + Inter (sans-serif body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Font Awesome for social icons -->
  <script src="https://kit.fontawesome.com/9745af1226.js" crossorigin="anonymous"></script>

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>

  {% include navigation.html %}

  <main class="site-content">
    {{ content }}
  </main>

  {% include footer.html %}

</body>
</html>
